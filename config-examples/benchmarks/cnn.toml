[experiment]
name = "cnn_ep_genomic_order"
task = "bacterial_promoter_prediction"
description = "CNN benchmark on the shared E. coli promoter classification split."
seed = 42

[dataset]
name = "ep_dnabert2_genomic_order"
format = "csv"
source_accession = "GSE144621"
source_url = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE144621"
version = "EP_DNA_BERT2_genomic_order"
sequence_field = "sequence"
label_field = "label"

[dataset.split_files]
train = "data/promoter_classification/train_EP_DNA_BERT2_genomic_order.csv"
validation = "data/promoter_classification/eval_EP_DNA_BERT2_genomic_order.csv"
test = "data/promoter_classification/test_EP_DNA_BERT2_genomic_order.csv"

[label]
source = "provided_binary"
positive_label = 1
negative_label = 0

[split]
strategy = "predefined"
seed = 42
validation_name = "eval"

[preprocessing]
encoding = "one_hot"
sequence_length = 300
pad_or_trim = true

[model]
family = "cnn"
name = "tiny_dna_cnn"
version = "baseline_config_v1"

[model.params]
input_channels = 5
conv_channels = [32, 64]
kernel_sizes = [7, 5]
pooling = "adaptive_max"
classifier_hidden = 32

[training]
seed = 42
batch_size = 16
max_epochs = 50
learning_rate = 0.001

[training.params]
optimizer = "adam"
loss = "cross_entropy"
early_stopping_metric = "mcc"

[evaluation]
primary_metric = "mcc"
threshold_strategy = "validation_mcc"
metrics = [
  "accuracy",
  "balanced_accuracy",
  "auroc",
  "auprc",
  "f1",
  "mcc",
  "precision",
  "sensitivity",
  "specificity",
  "confusion_matrix",
]

[outputs]
output_dir = "outputs/benchmarks/cnn_ep_genomic_order"
save_json = true
save_csv = true
save_predictions = true

[environment]
device = "auto"
precision = "float32"
