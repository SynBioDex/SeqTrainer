[experiment]
name = "dnabert2_frozen_ai_x_bio"
task = "bacterial_promoter_prediction"
description = "Frozen DNABERT2 encoder benchmark on prepared ai x bio train/validation/test CSV splits."
seed = 42

[dataset]
name = "ai_x_bio"
format = "csv"
source_accession = "ai_x_bio_drive_file"
source_url = ""
version = "prepared_sequence_label_id_splits"
sequence_field = "sequence"
label_field = "label"
id_field = "id"

[dataset.split_files]
train = "data/benchmarks/ai_x_bio/train.csv"
validation = "data/benchmarks/ai_x_bio/validation.csv"
test = "data/benchmarks/ai_x_bio/test.csv"

[label]
source = "provided_binary"
positive_label = 1
negative_label = 0

[split]
strategy = "predefined"
seed = 42
validation_name = "validation"

[preprocessing]
encoding = "dnabert2_tokenizer"
sequence_length = 300
pad_or_trim = false

[preprocessing.params]
model_max_length = 104
padding = "longest"
pad_to_multiple_of = 8

[model]
family = "dnabert2"
name = "zhihan1996/DNABERT-2-117M"
version = "pin_model_revision_before_final_report"

[model.params]
mode = "frozen_embedding_classifier"
pooling = "mean"
trust_remote_code = true
allow_download = true
require_model_files = true
classifier_dropout = 0.1
cache_embeddings = true
disable_flash_attention = true

[training]
seed = 42
batch_size = 16
max_epochs = 50
learning_rate = 0.0003

[training.params]
optimizer = "adamw"
loss = "bce_with_logits"
warmup_ratio = 0.06
weight_decay = 0.0001
early_stopping_patience = 8

[evaluation]
primary_metric = "mcc"
threshold_strategy = "validation_mcc"
metrics = [
  "accuracy",
  "balanced_accuracy",
  "auroc",
  "auprc",
  "f1",
  "mcc",
  "precision",
  "sensitivity",
  "specificity",
  "confusion_matrix",
]

[outputs]
output_dir = "outputs/benchmarks/dnabert2_frozen_ai_x_bio"
save_json = true
save_csv = true
save_predictions = true

[environment]
device = "auto"
precision = "float32"
