[experiment]
name = "ipromp_external_ep_genomic_order"
task = "bacterial_promoter_prediction"
description = "External iPro-MP/iPromoter benchmark on the shared E. coli promoter classification split."
seed = 42

[dataset]
name = "ep_dnabert2_genomic_order"
format = "csv"
source_accession = "GSE144621"
source_url = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE144621"
version = "EP_DNA_BERT2_genomic_order"
sequence_field = "sequence"
label_field = "label"

[dataset.split_files]
train = "data/promoter_classification/train_EP_DNA_BERT2_genomic_order.csv"
validation = "data/promoter_classification/eval_EP_DNA_BERT2_genomic_order.csv"
test = "data/promoter_classification/test_EP_DNA_BERT2_genomic_order.csv"

[label]
source = "provided_binary"
positive_label = 1
negative_label = 0

[split]
strategy = "predefined"
seed = 42
validation_name = "eval"

[preprocessing]
encoding = "ipromp_fasta_6mer_external"
sequence_length = 300
pad_or_trim = false

[preprocessing.params]
kmer_size = 6
tokenization = "overlapping_6mer"
alphabet = "ACGTN"

[model]
family = "ipromp"
name = "ipromp_ecoli_k12_mg1655_external"
version = "pin_external_model_files_before_final_report"

[model.params]
adapter_mode = "external_fasta_prediction"
species_id = 10
species_name = "Escherichia coli str K-12 substr. MG1655"
kmer_size = 6
model_family_source = "official_ipromp"
official_repo = "https://github.com/Jackie-Suv/iPro-MP"
paper_url = "https://link.springer.com/article/10.1186/s13059-025-03819-9"
pretrained_model_source = "https://doi.org/10.5281/zenodo.15180138"
dnabert6_path = "./external/iPro-MP/DNABERT-6"
ipromp_repo_dir = "./external/iPro-MP"
ipromp_model_dir = "./external/iPro-MP/models"
fasta_output_dir = "outputs/benchmarks/ipromp_external_ep_genomic_order/ipromp_fasta"
mapping_csv = "outputs/benchmarks/ipromp_external_ep_genomic_order/ipromp_id_mapping.csv"
validation_predictions_csv = "outputs/benchmarks/ipromp_external_ep_genomic_order/external_predictions/validation_predictions.csv"
test_predictions_csv = "outputs/benchmarks/ipromp_external_ep_genomic_order/external_predictions/test_predictions.csv"
# Optional when available:
# train_predictions_csv = "outputs/benchmarks/ipromp_external_ep_genomic_order/external_predictions/train_predictions.csv"
external_probability_column = "Probability"
external_prediction_column = "Prediction"
external_sequence_column = "Sequence"
threshold_metric = "mcc"
requires_probability_for_primary_comparison = true

[training]
seed = 42
batch_size = 1
max_epochs = 0
learning_rate = 0.0

[training.params]
mode = "external_inference_only"
optimizer = "not_applicable"
loss = "not_applicable"

[evaluation]
primary_metric = "mcc"
threshold_strategy = "validation_mcc"
metrics = [
  "accuracy",
  "balanced_accuracy",
  "auroc",
  "auprc",
  "f1",
  "mcc",
  "precision",
  "sensitivity",
  "specificity",
  "confusion_matrix",
]

[outputs]
output_dir = "outputs/benchmarks/ipromp_external_ep_genomic_order"
save_json = true
save_csv = true
save_predictions = true

[environment]
device = "external"
precision = "external"

[environment.params]
external_python = "3.8"
requires_dnabert6 = true
requires_pretrained_weights = true
