<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="title desc">
  <title id="title">CNN-v2 MCC comparison</title>
  <desc id="desc">CNN-v2 regularized 50-cycle model improves validation MCC from 0.169 to 0.226 and test MCC from 0.187 to 0.221 compared with the 10-cycle reference CNN.</desc>
  <rect width="1180" height="460" fill="#1f2328"/>
  <text x="28" y="42" fill="#f6f8fa" font-family="Arial, sans-serif" font-size="24" font-weight="700">CNN-v2 final benchmark comparison</text>
  <text x="28" y="70" fill="#c9d1d9" font-family="Arial, sans-serif" font-size="14">Model choice is based on validation MCC; held-out test MCC and AUPRC are checked after selection.</text>

  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="28" y="96" width="1124" height="36" fill="#30363d"/>
    <text x="48" y="119" fill="#f6f8fa" font-weight="700">experiment</text>
    <text x="340" y="119" fill="#f6f8fa" font-weight="700">validation MCC</text>
    <text x="500" y="119" fill="#f6f8fa" font-weight="700">test MCC</text>
    <text x="630" y="119" fill="#f6f8fa" font-weight="700">test AUPRC</text>
    <text x="770" y="119" fill="#f6f8fa" font-weight="700">interpretation</text>

    <rect x="28" y="132" width="1124" height="42" fill="#444"/>
    <text x="48" y="158" fill="#f6f8fa">tiny_10_cycles_reference</text>
    <text x="340" y="158" fill="#f6f8fa">0.168827</text>
    <text x="500" y="158" fill="#f6f8fa">0.187208</text>
    <text x="630" y="158" fill="#f6f8fa">0.618783</text>
    <text x="770" y="158" fill="#c9d1d9">reference CNN</text>

    <rect x="28" y="174" width="1124" height="42" fill="#2b3138"/>
    <text x="48" y="200" fill="#f6f8fa">cnn_v2_regularized_100_cycles</text>
    <text x="340" y="200" fill="#f6f8fa">0.219189</text>
    <text x="500" y="200" fill="#f6f8fa">0.208165</text>
    <text x="630" y="200" fill="#f6f8fa">0.634116</text>
    <text x="770" y="200" fill="#c9d1d9">improves over reference</text>

    <rect x="28" y="216" width="1124" height="42" fill="#444"/>
    <text x="48" y="242" fill="#f6f8fa">cnn_v2_regularized_50_cycles</text>
    <text x="340" y="242" fill="#f6f8fa">0.225811</text>
    <text x="500" y="242" fill="#f6f8fa">0.220884</text>
    <text x="630" y="242" fill="#f6f8fa">0.645976</text>
    <text x="770" y="242" fill="#7ee787" font-weight="700">best CNN-v2 candidate</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="28" y="308" fill="#f6f8fa" font-size="18" font-weight="700">MCC progression</text>
    <text x="28" y="336" fill="#c9d1d9" font-size="14">Validation MCC: 0.168827 -> 0.225811, absolute gain +0.056984, relative gain about +33.8%.</text>
    <text x="28" y="360" fill="#c9d1d9" font-size="14">Test MCC: 0.187208 -> 0.220884, absolute gain +0.033676, relative gain about +18.0%.</text>
    <text x="28" y="384" fill="#c9d1d9" font-size="14">Test AUPRC: 0.618783 -> 0.645976, absolute gain +0.027193.</text>

    <rect x="610" y="305" width="420" height="20" fill="#30363d"/>
    <rect x="610" y="305" width="266" height="20" fill="#8b949e"/>
    <text x="1044" y="321" fill="#f6f8fa" font-size="13">reference val MCC 0.169</text>

    <rect x="610" y="340" width="420" height="20" fill="#30363d"/>
    <rect x="610" y="340" width="356" height="20" fill="#7ee787"/>
    <text x="1044" y="356" fill="#f6f8fa" font-size="13">CNN-v2 val MCC 0.226</text>

    <rect x="610" y="375" width="420" height="20" fill="#30363d"/>
    <rect x="610" y="375" width="295" height="20" fill="#8b949e"/>
    <text x="1044" y="391" fill="#f6f8fa" font-size="13">reference test MCC 0.187</text>

    <rect x="610" y="410" width="420" height="20" fill="#30363d"/>
    <rect x="610" y="410" width="348" height="20" fill="#7ee787"/>
    <text x="1044" y="426" fill="#f6f8fa" font-size="13">CNN-v2 test MCC 0.221</text>
  </g>
</svg>
