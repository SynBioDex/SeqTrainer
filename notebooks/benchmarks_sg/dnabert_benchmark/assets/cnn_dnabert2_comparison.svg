<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CNN and DNABERT2 promoter benchmark comparison</title>
  <desc id="desc">Current SeqTrainer shared-split promoter benchmark results, including CNN reference, CNN-v2, DNABERT2 frozen, DNABERT2 T4 fine-tuning, and the planned A100 Alpine profile.</desc>
  <rect width="1600" height="1040" fill="#0d1117"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="58" fill="#f0f6fc" font-size="32" font-weight="700">SeqTrainer shared-split promoter benchmark</text>
    <text x="52" y="92" fill="#b1bac4" font-size="18">All recorded scores use validation-only threshold selection and held-out test reporting. Primary metric: MCC. Secondary metric: AUPRC.</text>

    <rect x="52" y="125" width="1496" height="305" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="82" y="166" fill="#f0f6fc" font-size="23" font-weight="700">Recorded test results</text>
    <text x="82" y="193" fill="#8b949e" font-size="15">Higher is better. CNN-v2 is still the strongest completed run.</text>

    <g font-size="15" font-weight="700" fill="#f0f6fc">
      <text x="82" y="230">Model/run</text>
      <text x="500" y="230">Test MCC</text>
      <text x="640" y="230">Test AUPRC</text>
      <text x="790" y="230">Recall</text>
      <text x="910" y="230">Specificity</text>
      <text x="1050" y="230">Threshold</text>
      <text x="1190" y="230">Status</text>
    </g>

    <g font-size="15">
      <rect x="72" y="245" width="1456" height="42" fill="#21262d"/>
      <text x="82" y="272" fill="#f0f6fc">CNN reference, 10 cycles</text>
      <text x="500" y="272" fill="#f0f6fc">0.187208</text>
      <text x="640" y="272" fill="#f0f6fc">0.618783</text>
      <text x="790" y="272" fill="#f0f6fc">0.217647</text>
      <text x="910" y="272" fill="#f0f6fc">0.916195</text>
      <text x="1050" y="272" fill="#f0f6fc">0.670</text>
      <text x="1190" y="272" fill="#b1bac4">Reproduced baseline</text>

      <rect x="72" y="287" width="1456" height="42" fill="#263529"/>
      <text x="82" y="314" fill="#7ee787" font-weight="700">CNN-v2, 50 cycles</text>
      <text x="500" y="314" fill="#7ee787" font-weight="700">0.220884</text>
      <text x="640" y="314" fill="#7ee787" font-weight="700">0.645976</text>
      <text x="790" y="314" fill="#7ee787">0.216152</text>
      <text x="910" y="314" fill="#7ee787">0.936814</text>
      <text x="1050" y="314" fill="#7ee787">0.630</text>
      <text x="1190" y="314" fill="#7ee787">Current best completed model</text>

      <rect x="72" y="329" width="1456" height="42" fill="#21262d"/>
      <text x="82" y="356" fill="#f0f6fc">DNABERT2 frozen v1</text>
      <text x="500" y="356" fill="#f0f6fc">0.124165</text>
      <text x="640" y="356" fill="#f0f6fc">0.575073</text>
      <text x="790" y="356" fill="#f0f6fc">0.344586</text>
      <text x="910" y="356" fill="#f0f6fc">0.767876</text>
      <text x="1050" y="356" fill="#f0f6fc">0.505220</text>
      <text x="1190" y="356" fill="#b1bac4">Frozen encoder baseline</text>

      <rect x="72" y="371" width="1456" height="42" fill="#21262d"/>
      <text x="82" y="398" fill="#f0f6fc">DNABERT2 full fine-tuning, T4</text>
      <text x="500" y="398" fill="#f0f6fc">0.147631</text>
      <text x="640" y="398" fill="#f0f6fc">0.365169</text>
      <text x="790" y="398" fill="#f0f6fc">0.078098</text>
      <text x="910" y="398" fill="#f0f6fc">0.981870</text>
      <text x="1050" y="398" fill="#f0f6fc">0.750244</text>
      <text x="1190" y="398" fill="#b1bac4">Completed T4 workflow check</text>
    </g>

    <rect x="52" y="460" width="1496" height="150" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="82" y="501" fill="#f0f6fc" font-size="23" font-weight="700">DNABERT2 full fine-tuning profiles</text>
    <g font-size="15" fill="#f0f6fc">
      <text x="82" y="539">T4 completed profile</text>
      <text x="82" y="568" fill="#b1bac4">2 epochs | batch 2 | accumulation 16 | effective batch 32 | FP16 | patience 1 | checkpointing enabled</text>
      <text x="820" y="539">A100/Alpine canonical profile</text>
      <text x="820" y="568" fill="#b1bac4">4 epochs | batch 4 | accumulation 8 | effective batch 32 | BF16 | patience 2 | same seed and splits</text>
    </g>

    <rect x="52" y="640" width="725" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="82" y="681" fill="#f0f6fc" font-size="23" font-weight="700">Fixed scientific contract</text>
    <g fill="#b1bac4" font-size="16">
      <text x="82" y="719">Dataset: GSE144621 EP_DNA_BERT2_genomic_order</text>
      <text x="82" y="748">Rows: train 136,484; validation 19,498; test 38,996</text>
      <text x="82" y="777">Labels: 1 = promoter-positive; 0 = non-promoter/background</text>
      <text x="82" y="806">Seed: 42 | sequence length: 300 bp</text>
      <text x="82" y="835">Threshold: selected on validation MCC only</text>
      <text x="82" y="864">Test set: final reporting only, never tuning</text>
    </g>

    <rect x="823" y="640" width="725" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="853" y="681" fill="#f0f6fc" font-size="23" font-weight="700">Interpretation</text>
    <g fill="#b1bac4" font-size="16">
      <text x="853" y="719">CNN-v2 currently improves over the CNN reference.</text>
      <text x="853" y="748">DNABERT2 T4 fine-tuning ran successfully but did not improve MCC.</text>
      <text x="853" y="777">The T4 result predicted too few positives, causing low recall.</text>
      <text x="853" y="806">More epochs may help only if validation MCC improves before overfitting.</text>
      <text x="853" y="835">The next claim-bearing DNABERT2 run should be A100/Alpine.</text>
      <text x="853" y="864">All final comparisons should rank by test MCC, then test AUPRC.</text>
    </g>

    <rect x="52" y="925" width="1496" height="50" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="82" y="956" fill="#f0f6fc" font-size="17" font-weight="700">Current decision: keep CNN-v2 as the strongest completed baseline while running the canonical DNABERT2 A100/Alpine profile.</text>
  </g>
</svg>
