[experiment]
name = "dnabert2_finetune_t4_ep_genomic_order"
task = "bacterial_promoter_prediction"
description = "Resource-constrained full DNABERT2 fine-tuning on a Colab T4 using the shared benchmark split."
seed = 42

[dataset]
name = "ep_dnabert2_genomic_order"
format = "csv"
source_accession = "GSE144621"
source_url = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE144621"
version = "EP_DNA_BERT2_genomic_order"
sequence_field = "sequence"
label_field = "label"

[dataset.split_files]
train = "data/promoter_classification/train_EP_DNA_BERT2_genomic_order.csv"
validation = "data/promoter_classification/eval_EP_DNA_BERT2_genomic_order.csv"
test = "data/promoter_classification/test_EP_DNA_BERT2_genomic_order.csv"

[label]
source = "provided_binary"
positive_label = 1
negative_label = 0

[split]
strategy = "predefined"
seed = 42
validation_name = "eval"

[preprocessing]
encoding = "dnabert2_tokenizer"
sequence_length = 300
pad_or_trim = false

[preprocessing.params]
model_max_length = 70
padding = "longest"

[model]
family = "dnabert2"
name = "zhihan1996/DNABERT-2-117M"
version = "7bce263b15377fc15361f52cfab88f8b586abda0"

[model.params]
mode = "full_finetune"
pooling = "mean"
trust_remote_code = true
allow_download = true
require_model_files = true
revision = "7bce263b15377fc15361f52cfab88f8b586abda0"
classifier_dropout = 0.1
fine_tuning_scope = "all_encoder_layers"
disable_flash_attention = true

[training]
seed = 42
batch_size = 2
max_epochs = 4
learning_rate = 0.00003

[training.params]
optimizer = "adamw"
loss = "bce_with_logits"
warmup_ratio = 0.1
weight_decay = 0.01
early_stopping_patience = 1
early_stopping_metric = "validation_mcc"
gradient_accumulation_steps = 16
gradient_checkpointing = true
max_grad_norm = 1.0
resource_profile = "colab_t4_reduced_epochs"
diagnostics = ["train_loss", "validation_loss", "validation_mcc", "learning_rate"]

[evaluation]
primary_metric = "mcc"
threshold_strategy = "validation_mcc"
metrics = [
  "accuracy",
  "balanced_accuracy",
  "auroc",
  "auprc",
  "f1",
  "mcc",
  "precision",
  "sensitivity",
  "specificity",
  "confusion_matrix",
]

[outputs]
output_dir = "outputs/benchmarks/dnabert2_finetune_t4_ep_genomic_order"
save_json = true
save_csv = true
save_predictions = true

[environment]
device = "auto"
precision = "fp16"

[environment.params]
platform = "Google Colab"
gpu = "NVIDIA T4"
python = "3.10"
torch = "2.2.2"
transformers = "4.29.2"
