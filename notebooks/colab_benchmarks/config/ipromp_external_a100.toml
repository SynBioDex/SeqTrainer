[experiment]
name = "ipromp_external_a100_ep_genomic_order"
task = "bacterial_promoter_prediction"
description = "Official iPro-MP E. coli five-fold ensemble on validation and test using a Colab A100."
seed = 42

[dataset]
name = "ep_dnabert2_genomic_order"
format = "csv"
source_accession = "GSE144621"
source_url = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE144621"
version = "EP_DNA_BERT2_genomic_order"
sequence_field = "sequence"
label_field = "label"

[dataset.split_files]
train = "data/promoter_classification/train_EP_DNA_BERT2_genomic_order.csv"
validation = "data/promoter_classification/eval_EP_DNA_BERT2_genomic_order.csv"
test = "data/promoter_classification/test_EP_DNA_BERT2_genomic_order.csv"

[label]
source = "provided_binary"
positive_label = 1
negative_label = 0

[split]
strategy = "predefined"
seed = 42
validation_name = "eval"

[preprocessing]
encoding = "ipromp_fasta_6mer_external"
sequence_length = 300
pad_or_trim = false

[preprocessing.params]
kmer_size = 6
tokenization = "overlapping_6mer"
model_max_length = 300

[model]
family = "ipromp"
name = "ipromp_ecoli_k12_mg1655_official_ensemble"
version = "zenodo-15180139"

[model.params]
adapter_mode = "seqtrainer_official_fold_ensemble"
species_id = 10
species_name = "Escherichia coli str K-12 substr. MG1655"
kmer_size = 6
folds = 5
max_length = 300
inference_batch_size = 32
dnabert6_source = "zhihan1996/DNA_bert_6"
pretrained_model_source = "https://doi.org/10.5281/zenodo.15180139"
mapping_csv = "outputs/benchmarks/ipromp_external_a100_ep_genomic_order/ipromp_id_mapping.csv"
train_predictions_csv = "outputs/benchmarks/ipromp_external_a100_ep_genomic_order/external_predictions/train_predictions.csv"
validation_predictions_csv = "outputs/benchmarks/ipromp_external_a100_ep_genomic_order/external_predictions/validation_predictions.csv"
test_predictions_csv = "outputs/benchmarks/ipromp_external_a100_ep_genomic_order/external_predictions/test_predictions.csv"

[training]
seed = 42
batch_size = 32
max_epochs = 0
learning_rate = 0.0

[training.params]
mode = "official_pretrained_external_inference"
optimizer = "not_applicable"
loss = "not_applicable"
resource_profile = "colab_a100_validation_test_only_batch32"

[evaluation]
primary_metric = "mcc"
threshold_strategy = "validation_mcc"
metrics = [
  "accuracy",
  "balanced_accuracy",
  "auroc",
  "auprc",
  "f1",
  "mcc",
  "precision",
  "sensitivity",
  "specificity",
  "confusion_matrix",
]

[outputs]
output_dir = "outputs/benchmarks/ipromp_external_a100_ep_genomic_order"
save_json = true
save_csv = true
save_predictions = true

[environment]
device = "cuda"
precision = "float32"

[environment.params]
platform = "Google Colab"
gpu = "NVIDIA A100"
python = "3.10"
torch = "2.2.2"
transformers = "4.29.2"
