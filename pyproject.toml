[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqtrainer"
version = "0.1.0"
description = "Synthetic biology domain toolkit for SBOL/SynBioHub ML workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["synthetic biology", "sbol", "synbiohub", "machine learning", "dna"]
authors = [
  { name = "Gonzalo Vidal", email = "Gonzalo.VidalPena@colorado.edu" },
  { name = "Sai Wong", email = "sai.wong@sjsu.edu" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "pandas>=1.5",
  "numpy>=1.24",
  "rdflib>=6.3.2",
  "scikit-learn>=1.3",
  "requests>=2.31",
  "sbol2>=1.4",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
annotation = [
  "biopython>=1.83",
  "sbol3>=1.2",
  "tyto>=1.4",
]
keras = [
  "tensorflow>=2.12",
]
torch = [
  "torch>=2.2",
  "transformers>=4.30",
  "einops>=0.6.1",
]
gnn = [
  "torch>=2.2",
  "torch-geometric>=2.4",
]
dev = [
  "biopython>=1.83",
  "sbol3>=1.2",
  "tyto>=1.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
seqtrainer = "seqtrainer.cli.main:main"

[project.urls]
Homepage = "https://github.com/SynBioDex/SeqTrainer"
"Bug Tracker" = "https://github.com/SynBioDex/SeqTrainer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["seqtrainer*"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
